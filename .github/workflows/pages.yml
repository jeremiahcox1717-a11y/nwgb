name: GitHub Pages

on:
  push:
    branches: [main, cursor/open-the-desk-ffa8]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the private desk
        run: |
          mkdir -p dist/server dist/data
          cp public/index.html public/app.js public/styles.css public/robots.txt dist/
          cp public/.nojekyll dist/ || true
          touch dist/.nojekyll
          cp server/*.js dist/server/
          rm -f dist/server/index.js
          cp data/*.json dist/data/
      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          force_orphan: true
          enable_jekyll: false
